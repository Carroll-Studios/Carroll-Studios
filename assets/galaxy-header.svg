<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Céu de galáxia animado com planeta de anel, estrelas cintilantes e uma estrela cadente">
  <defs>
    <linearGradient id="galaxyBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0D0B1E"/>
      <stop offset="100%" stop-color="#1A1730"/>
    </linearGradient>
    <radialGradient id="nebula1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebula2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="planetBody" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#F3F0FF"/>
      <stop offset="100%" stop-color="#C4B5FD"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="1000" height="260" fill="url(#galaxyBg)"/>

  <ellipse cx="220" cy="90" rx="260" ry="140" fill="url(#nebula1)"/>
  <ellipse cx="700" cy="180" rx="220" ry="120" fill="url(#nebula2)"/>

  <g fill="#E9E4FF">
    <circle cx="60" cy="40" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="140" cy="90" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="3.2s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="230" cy="50" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" begin="1s" repeatCount="indefinite"/></circle>
    <circle cx="320" cy="140" r="1.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" begin="0.2s" repeatCount="indefinite"/></circle>
    <circle cx="410" cy="70" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="490" cy="180" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.4s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="560" cy="45" r="2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="620" cy="130" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="3s" begin="0.9s" repeatCount="indefinite"/></circle>
    <circle cx="60" cy="200" r="1.6"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.1s" begin="0.6s" repeatCount="indefinite"/></circle>
    <circle cx="190" cy="220" r="1.4"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="360" cy="30" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="2.9s" begin="1.4s" repeatCount="indefinite"/></circle>
    <circle cx="960" cy="60" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="0.3s" repeatCount="indefinite"/></circle>
    <circle cx="990" cy="150" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" begin="0.9s" repeatCount="indefinite"/></circle>
  </g>

  <g>
    <line x1="0" y1="0" x2="46" y2="16" stroke="#E9E4FF" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.55;0.62;0.78;1" dur="6s" repeatCount="indefinite"/>
      <animateTransform attributeName="transform" type="translate" values="120,10; 480,90" keyTimes="0;1" begin="0s" dur="6s" repeatCount="indefinite"/>
    </line>
  </g>

  <g transform="translate(770,95)">
    <circle r="46" fill="url(#planetBody)"/>
    <circle cx="-14" cy="-12" r="6" fill="#C4B5FD" opacity="0.6"/>
    <circle cx="10" cy="14" r="9" fill="#C4B5FD" opacity="0.5"/>
    <circle cx="16" cy="-16" r="4" fill="#C4B5FD" opacity="0.5"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="40s" repeatCount="indefinite"/>
      <ellipse rx="78" ry="16" fill="none" stroke="#8B5CF6" stroke-width="4" transform="rotate(-18)"/>
      <ellipse rx="78" ry="16" fill="none" stroke="#E9E4FF" stroke-width="1" opacity="0.6" transform="rotate(-18)"/>
    </g>
  </g>

  <circle cx="120" cy="150" r="6" fill="#6D28D9" opacity="0.8"/>
  <circle cx="900" cy="210" r="9" fill="#EC4899" opacity="0.5"/>
</svg>
