<svg viewBox="0 0 1000 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Céu de galáxia calmo para encerrar o perfil">
  <defs>
    <linearGradient id="galaxyBgFooter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1A1730"/>
      <stop offset="100%" stop-color="#0D0B1E"/>
    </linearGradient>
    <radialGradient id="nebulaFooter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="ringFrontClipFooter">
      <rect x="-40" y="0" width="80" height="12"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1000" height="140" fill="url(#galaxyBgFooter)"/>
  <ellipse cx="500" cy="80" rx="360" ry="90" fill="url(#nebulaFooter)"/>

  <g fill="#E9E4FF">
    <circle cx="100" cy="30" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="260" cy="60" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" begin="0.4s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="24" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" begin="0.8s" repeatCount="indefinite"/></circle>
    <circle cx="580" cy="70" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3.2s" begin="1.1s" repeatCount="indefinite"/></circle>
    <circle cx="720" cy="34" r="1.6"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.8s" begin="0.5s" repeatCount="indefinite"/></circle>
    <circle cx="860" cy="58" r="1.8"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" begin="1.3s" repeatCount="indefinite"/></circle>
    <circle cx="940" cy="26" r="1.4"><animate attributeName="opacity" values="0.2;0.9;0.2" dur="3s" begin="0.2s" repeatCount="indefinite"/></circle>
  </g>

  <g transform="translate(500,95)">
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
      <g transform="rotate(-18)">
        <ellipse rx="32" ry="7" fill="none" stroke="#8B5CF6" stroke-width="2.5"/>
      </g>
    </g>
    <circle r="18" fill="#C4B5FD" opacity="0.9"/>
    <g>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="30s" repeatCount="indefinite"/>
      <g transform="rotate(-18)" clip-path="url(#ringFrontClipFooter)">
        <ellipse rx="32" ry="7" fill="none" stroke="#8B5CF6" stroke-width="2.5"/>
      </g>
    </g>
  </g>
</svg>
