<svg width="40" height="220" viewBox="0 0 40 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="ribbonGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8B5CF6" stop-opacity="0.15"/>
      <stop offset="15%" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.75"/>
      <stop offset="85%" stop-color="#8B5CF6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <!-- corpo da fita, com pontas em V como uma fita de verdade -->
  <path d="M14 10 L26 10 L26 195 L20 205 L14 195 Z" fill="url(#ribbonGrad)"/>
  <path d="M14 10 L8 4 L14 10 Z" fill="#8B5CF6" opacity="0.6"/>
  <path d="M26 10 L32 4 L26 10 Z" fill="#8B5CF6" opacity="0.6"/>

  <!-- planetinha com anel -->
  <g transform="translate(20 55)">
    <ellipse cx="0" cy="0" rx="9" ry="3" fill="none" stroke="#F5D0FE" stroke-width="1" transform="rotate(-20)"/>
    <circle cx="0" cy="0" r="5" fill="#F0ABFC"/>
  </g>

  <!-- estrelinhas em forma de brilho -->
  <g fill="#FDE68A">
    <path d="M20 100 l1.4 3.6 3.6 1.4 -3.6 1.4 -1.4 3.6 -1.4 -3.6 -3.6 -1.4 3.6 -1.4 Z"/>
  </g>
  <g fill="#FFFFFF">
    <path d="M20 145 l1 2.6 2.6 1 -2.6 1 -1 2.6 -1 -2.6 -2.6 -1 2.6 -1 Z"/>
  </g>

  <!-- cometinha -->
  <g transform="translate(20 175)">
    <circle cx="0" cy="0" r="2.2" fill="#C4B5FD"/>
    <path d="M-2 -2 L-9 -9" stroke="#C4B5FD" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- poeira de estrelas ao longo da fita -->
  <circle cx="20" cy="30" r="0.9" fill="#FFFFFF"/>
  <circle cx="20" cy="80" r="0.7" fill="#FBCFE8"/>
  <circle cx="20" cy="120" r="0.8" fill="#FFFFFF"/>
  <circle cx="20" cy="160" r="0.7" fill="#DDD6FE"/>
  <circle cx="20" cy="190" r="0.8" fill="#FFFFFF"/>
</svg>
