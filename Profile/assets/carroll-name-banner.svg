<svg viewBox="0 0 1000 170" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Carroll Studios">
  <defs>
    <linearGradient id="nameBackdropGalaxy" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1A1730"/>
      <stop offset="100%" stop-color="#0D0B1E"/>
    </linearGradient>
    <clipPath id="typeRevealGalaxy">
      <rect x="0" y="0" height="170" width="0">
        <animate attributeName="width" from="0" to="1000" dur="2.2s" fill="freeze" begin="0.2s"/>
      </rect>
    </clipPath>
  </defs>

  <rect x="130" y="20" width="740" height="110" rx="26" fill="url(#nameBackdropGalaxy)"/>
  <rect x="130" y="20" width="740" height="110" rx="26" fill="none" stroke="#6D28D9" stroke-width="1.5" opacity="0.6"/>

  <g fill="#8B5CF6" opacity="0.5">
    <circle cx="152" cy="38" r="1.6"/>
    <circle cx="848" cy="112" r="1.6"/>
    <circle cx="160" cy="112" r="1.4"/>
    <circle cx="840" cy="38" r="1.4"/>
  </g>

  <g clip-path="url(#typeRevealGalaxy)">
    <text x="500" y="90" text-anchor="middle" font-family="Consolas, 'Courier New', monospace" font-weight="700" font-size="34" fill="#E9E4FF" letter-spacing="1.5">Carroll Studios</text>
  </g>

  <rect x="665" y="63" width="4" height="36" fill="#E9E4FF" opacity="0">
    <animate attributeName="opacity" values="1;0;1;0;1" dur="1.6s" begin="2.4s" repeatCount="indefinite"/>
  </rect>
</svg>
